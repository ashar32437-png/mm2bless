<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MM2BLESS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235aa9ff'/%3E%3Cpath d='M7.5 4.5 19.5 8.5 15.5 20.5 3.5 16.5 7.5 4.5Z' fill='%23fff'/%3E%3Crect x='10' y='10' width='4.4' height='4.4' rx='0.8' transform='rotate(-16 12.2 12.2)' fill='%23191b1f'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #191b1f;
    --card: rgba(255, 255, 255, 0.05);
    --stroke: rgba(255, 255, 255, 0.09);
    --text: #eef3f9;
    --muted: #8d97a6;
    --accent: #5aa9ff;
    --accent-2: #9ad4ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient background glow */
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .glow::before,
  .glow::after {
    content: "";
    position: absolute;
    width: 55vmax;
    height: 55vmax;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    animation: float 18s ease-in-out infinite alternate;
  }
  .glow::before {
    background: radial-gradient(circle, var(--accent) 0%, transparent 65%);
    top: -20vmax;
    left: -15vmax;
  }
  .glow::after {
    background: radial-gradient(circle, #2f62b5 0%, transparent 65%);
    bottom: -22vmax;
    right: -16vmax;
    animation-delay: -9s;
  }
  @keyframes float {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(6vmax, 5vmax, 0) scale(1.15); }
  }

  /* Subtle grid texture */
  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 78%);
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 44px 36px 36px;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 26px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
      0 30px 70px -20px rgba(0, 0, 0, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.07);
    text-align: center;
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: var(--text);
  }

  .divider {
    height: 1px;
    margin: 30px 0;
    background: linear-gradient(90deg, transparent, var(--stroke) 20%, var(--stroke) 80%, transparent);
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 17px 20px;
    border: 1px solid var(--stroke);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    text-decoration: none;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .btn:nth-child(1) { animation-delay: 0.12s; }
  .btn:nth-child(2) { animation-delay: 0.22s; }

  .btn .icon {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.07);
    transition: background 0.25s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .btn .label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .btn .sub { font-size: 12.5px; font-weight: 400; color: var(--muted); }

  .btn .arrow {
    margin-left: auto;
    color: var(--muted);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), color 0.25s ease;
  }

  .btn:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.075);
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 18px 34px -16px rgba(0, 0, 0, 0.85);
  }
  .btn:hover .arrow { transform: translateX(4px); color: var(--text); }
  .btn:hover .icon { transform: scale(1.06); }

  .btn:active { transform: translateY(-1px) scale(0.99); }
  .btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }

  .btn.primary {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    border-color: transparent;
    color: #0f1319;
    box-shadow: 0 16px 34px -14px rgba(90, 169, 255, 0.55);
  }
  .btn.primary .icon { background: rgba(15, 19, 25, 0.16); }
  .btn.primary .icon svg { stroke: #0f1319; }
  .btn.primary .sub { color: rgba(15, 19, 25, 0.66); }
  .btn.primary .arrow { color: rgba(15, 19, 25, 0.72); }
  .btn.primary:hover {
    box-shadow: 0 22px 44px -14px rgba(90, 169, 255, 0.8);
    background: linear-gradient(135deg, #7cc4ff 0%, #a9e0ff 100%);
  }
  .btn.primary:hover .arrow { color: #0f1319; }

  .foot {
    display: inline-block;
    max-width: 100%;
    margin-top: 26px;
    padding: 11px 16px;
    border: 1px solid rgba(90, 169, 255, 0.24);
    border-radius: 12px;
    background: rgba(90, 169, 255, 0.09);
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.5;
    color: #b9d8ff;
  }

  @media (max-width: 420px) {
    .card { padding: 34px 22px 28px; border-radius: 22px; }
    h1 { font-size: 23px; }
    .btn { padding: 15px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <main class="card">
    <h1>MM2BLESS</h1>

    <div class="divider"></div>

    <div class="buttons">
      <a class="btn primary"        href="https://www.roblox.com.mu/users/7620369338/profile" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span class="label">
          Roblox Profile
          <span class="sub">View my profile</span>
        </span>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7"/><path d="M8 7h9v9"/>
        </svg>
      </a>

      <a class="btn"        href="https://www.roblox.com.mu/games/142823291/Murder-Mystery-2?privateServerLinkCode=89239294071385675125994794053480" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff8a5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="#7cc7ff"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="#7cc7ff"/>
          </svg>
        </span>
        <span class="label">
          Private Server
          <span class="sub">Join my server</span>
        </span>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7"/><path d="M8 7h9v9"/>
        </svg>
      </a>
    </div>

    <p class="foot">Make sure you are level 10 before joining! Or else I will not trade you.</p>
  </main>
</body>
</html>
